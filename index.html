<script>
(function(){
  const URL = "https://muflmlxijkguivkuwqit.supabase.co";
  const KEY = "sb_publishable_SSaQ9LucZGb01mjv6wwdlQ_yhk30aUI";
  let sb = null;
  function getSB(){
    if(sb) return sb;
    if(window.supabase && window.supabase.createClient){
      sb = window.supabase.createClient(URL, KEY);
      return sb;
    }
    return null;
  }
  function badge(t){
    let el=document.getElementById('tpfl-cloud-badge');
    if(!el){
      el=document.createElement('div');
      el.id='tpfl-cloud-badge';
      el.style.cssText='position:fixed;bottom:10px;right:10px;background:#0F0F14;color:#fff;padding:6px 12px;border-radius:999px;font-size:10px;z-index:999999;border:1px solid #7C3AED;font-family:monospace;';
      document.body.appendChild(el);
    }
    el.textContent=t+' '+URL;
  }

    const c=getSB(); if(!c){badge('CONNECTING'); setTimeout(load,800); return;}

    try{
      const r1=await c.from('kas_periode').select('*');
      const r2=await c.from('siswa_profiles').select('*');
      const r3=await c.from('kas_expense').select('*');

    }catch(e){console.error(e); badge('ERROR');}
  }

    document.addEventListener('click', async (e)=>{
      const btn = e.target.closest('button');
      if(!btn) return;
      const txt = (btn.textContent||'').toLowerCase();
      if(txt.includes('simpan') && (txt.includes('profil') || txt.includes('portfolio') || txt.includes('keahlian'))){
        // Try to find absen from page state - look for selected absen in window or DOM
        let absen = window.__SELECTED_ABSEN__ || window.__CURRENT_ABSEN__ || null;
        if(!absen){
          // Try to parse from URL hash or localStorage
          const sel = document.querySelector('[data-absen]')?.getAttribute('data-absen');
          if(sel) absen=sel;
        }
        // Fallback: try to get from global React state exposed
        if(!absen){
          // Look for input that shows absen number
          const possible = document.body.innerHTML.match(/absen[:\s]+(\d+)/i);
          if(possible) absen=possible[1];
        }
        if(absen){
          const keahlian = document.querySelector('textarea[placeholder*="keahlian" i], textarea[name*="keahlian" i]')?.value || '';

              console.log('profile saved cloud', absen);
            }catch(err){console.error(err);}
          }
        }
      }
    });
  }
